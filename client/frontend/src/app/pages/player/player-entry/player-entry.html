<div class="page-center">
  <div class="w-full">
    <div class="entry-logo">
      <app-logo />
    </div>

    <form class="glass entry-form anim-fade-in-up" (ngSubmit)="handleJoin()">
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Sınav PIN Kodu</mat-label>
        <input
          matInput
          inputmode="numeric"
          maxlength="6"
          placeholder="6 haneli PIN"
          [value]="pinCode()"
          (input)="onPinChange($any($event.target).value)"
        />
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Ad Soyad</mat-label>
        <input
          matInput
          maxlength="40"
          placeholder="Örn: Ayşe Yılmaz"
          [value]="nickname()"
          (input)="onNicknameChange($any($event.target).value)"
        />
        @if (nicknameError()) {
          <mat-error>{{ nicknameError() }}</mat-error>
        }
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Takım Adı (isteğe bağlı)</mat-label>
        <input
          matInput
          maxlength="40"
          placeholder="Takım modunda doldurulur"
          [value]="teamName()"
          (input)="teamName.set($any($event.target).value)"
        />
      </mat-form-field>

      <app-alert [message]="error()" />

      <button
        mat-flat-button
        color="primary"
        type="submit"
        class="entry-submit"
        [disabled]="loading()"
      >
        {{ loading() ? 'Katılıyorum…' : 'Sınava Katıl' }}
      </button>

      <a routerLink="/" class="entry-back">Ana Sayfa</a>
    </form>
  </div>
</div>
