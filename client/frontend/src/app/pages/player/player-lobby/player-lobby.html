@if (session(); as s) {
  <div class="lobby">
    <app-sound-toggle positionClass="lobby-sound" />

    <div class="lobby-body">
      <app-logo />

      <div class="glass lobby-card anim-fade-in-up">
        <div class="flex-center">
          <app-avatar
            [emoji]="s.avatar.emoji"
            [color]="s.avatar.color"
            [fallbackText]="s.playerName"
            size="xl"
          />
        </div>
        <h1 class="lobby-name">{{ s.playerName }}</h1>
        @if (s.teamName) {
          <p class="text-muted uppercase lobby-team">Takım: {{ s.teamName }}</p>
        }
      </div>

      <div class="text-center lobby-waiting-block">
        <h2 class="lobby-waiting">Sınav Başlaması Bekleniyor</h2>
        <p class="text-muted">
          "{{ s.quizTitle }}" sınavına {{ s.pinCode }} PIN koduyla katıldınız.
        </p>
      </div>

      <div class="lobby-spinner">
        <app-spinner label="Sınavın başlatılması bekleniyor..." />
      </div>
    </div>
  </div>
}
