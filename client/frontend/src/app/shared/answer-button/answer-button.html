<button
  type="button"
  class="option-card anim-fade-in-up {{ colorClass() }} {{ stateClass() }} {{
    extraClass()
  }}"
  [disabled]="disabled()"
  [style.animation-delay]="index() * 75 + 'ms'"
  (click)="answered.emit()"
>
  <span class="letter-badge {{ colorClass() }}">{{ letter() }}</span>
  <span class="option-text">{{ text() }}</span>
  @if (state() === 'correct') {
    <span class="option-mark">Doğru</span>
  }
  @if (state() === 'wrong') {
    <span class="option-mark">Yanlış</span>
  }
</button>
