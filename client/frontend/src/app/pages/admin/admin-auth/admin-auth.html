<div class="page-center">
  <div class="w-full">
    <div class="auth-logo">
      <app-logo />
    </div>

    <div class="glass auth-form anim-fade-in-up">
      <h2 class="auth-title">Yönetici Girişi</h2>

      <form (ngSubmit)="handleSubmit()" autocomplete="off" class="auth-fields">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Sicil Numarası</mat-label>
          <input
            matInput
            placeholder="Örn: admin1"
            autocomplete="username"
            [value]="registrationNumber()"
            (input)="registrationNumber.set($any($event.target).value)"
          />
          @if (registrationNumberError()) {
            <mat-error>{{ registrationNumberError() }}</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Şifre</mat-label>
          <input
            matInput
            type="password"
            autocomplete="current-password"
            [value]="password()"
            (input)="password.set($any($event.target).value)"
          />
          @if (passwordError()) {
            <mat-error>{{ passwordError() }}</mat-error>
          }
        </mat-form-field>

        <app-alert [message]="error()" />

        <button
          mat-flat-button
          color="primary"
          type="submit"
          class="auth-submit"
          [disabled]="loading()"
        >
          {{ loading() ? 'Giriş yapılıyor…' : 'Giriş Yap' }}
        </button>
      </form>
    </div>
  </div>
</div>
