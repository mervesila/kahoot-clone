<div class="page-center">
  <div class="w-full">
    <div class="join-logo">
      <app-logo size="lg" />
    </div>

    <form class="glass join-card anim-fade-in-up" (ngSubmit)="handleJoin($event)">
      <h1 class="join-title">Sınava Katıl</h1>
      <p class="join-sub">Adınızı yazın ve katılın. Sınav sizin katılımınızı bekliyor.</p>

      @if (pinLocked()) {
        <div class="pin-fill-note">QR kod okutuldu — PIN otomatik dolduruldu</div>
      }

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Sınav PIN Kodu</mat-label>
        <input
          matInput
          inputmode="numeric"
          maxlength="6"
          placeholder="PIN"
          [value]="pinCode()"
          [readonly]="pinLocked()"
          (input)="onPinChange($any($event.target).value)"
        />
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Ad Soyad</mat-label>
        <input
          matInput
          maxlength="60"
          placeholder="Örn: Ayşe Yılmaz"
          autocomplete="name"
          [value]="fullName()"
          (input)="fullName.set($any($event.target).value)"
        />
      </mat-form-field>

      <app-alert [message]="error()" />

      <button mat-flat-button color="primary" type="submit" class="join-submit">
        Katıl
      </button>

      <a routerLink="/" class="join-back">Ana Sayfa</a>
    </form>
  </div>
</div>
