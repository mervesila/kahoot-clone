@if (session(); as s) {
  <div class="lobby">
    <app-sound-toggle positionClass="lobby-sound" />

    <div class="lobby-body">
      <app-logo />

      <div class="anim-pop-in text-center">
        <div class="flex-center">
          <app-avatar [emoji]="s.avatar.emoji" [color]="s.avatar.color" size="xl" />
        </div>
        <h1 class="lobby-name">{{ s.playerName }}</h1>
        @if (s.teamName) {
          <p class="text-gold uppercase lobby-team">Takım: {{ s.teamName }}</p>
        }
      </div>

      <div class="text-center">
        <h2 class="lobby-waiting">Diğer oyuncular bekleniyor...</h2>
        <p class="text-muted">
          “{{ s.quizTitle }}” oyunu için {{ s.pinCode }} PIN kodunu kullandın.
        </p>
      </div>

      <div class="lobby-balloons">
        <span class="balloon">🎈</span>
        <span class="balloon balloon-2">🎈</span>
        <span class="balloon balloon-3">🎈</span>
      </div>
    </div>
  </div>
}
