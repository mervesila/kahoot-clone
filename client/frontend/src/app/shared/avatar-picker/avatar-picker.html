<div class="picker-section">
  <div class="glass-soft p-4">
    <p class="field-label">Karakterini Seç</p>
    <div class="emoji-grid">
      @for (emoji of emojis; track emoji) {
        <button
          type="button"
          class="emoji-cell {{ avatar().emoji === emoji ? 'selected' : '' }}"
          (click)="selectEmoji(emoji)"
          [attr.aria-label]="'Karakter ' + emoji"
        >
          {{ emoji }}
        </button>
      }
    </div>
  </div>
</div>

<div class="picker-section">
  <div class="glass-soft p-4">
    <p class="field-label">Renk Seç</p>
    <div class="color-row">
      @for (color of colors; track color.value) {
        <button
          type="button"
          class="color-cell {{ avatar().color === color.value ? 'selected' : '' }}"
          [style.background-color]="color.value"
          (click)="selectColor(color.value)"
          [attr.aria-label]="'Renk ' + color.name"
        ></button>
      }
    </div>
  </div>
</div>
